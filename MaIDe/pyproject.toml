[build-system]
requires = ["hatchling","pyyaml","requests"]
build-backend = "hatchling.build"

[project]
name = "MaIDe"
version = "1.0.0"
authors = [
  { name="Chinmay Raut", email="chinmay0raut+MaIDe@gmail.com" },
]
description = "NIS Mass Image Deconvoluter"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
]

[project.urls]
"Homepage" = "https://github.com/cvraut/NIS_MaIDe"
"Bug Tracker" = "https://github.com/cvraut/NIS_MaIDe/issues"

